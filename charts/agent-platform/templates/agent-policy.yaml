{{- if and .Values.runtime.strictResponses .Values.runtime.policyServiceImage }}
apiVersion: v1
kind: Service
metadata:
  name: responses-admission
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: responses-admission
  ports:
    - name: authorization
      port: 8083
      targetPort: authorization
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responses-admission
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: responses-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: responses-admission
    spec:
      automountServiceAccountToken: false
      containers:
        - name: policy
          image: {{ .Values.runtime.policyServiceImage | quote }}
          env:
            - name: AGENT_POLICY_MODE
              value: admission
          ports:
            - name: authorization
              containerPort: 8083
          readinessProbe:
            exec:
              command: ["/agent-policy", "--healthcheck"]
          livenessProbe:
            exec:
              command: ["/agent-policy", "--healthcheck"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: responses-admission
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: responses-admission
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: agent-ingress
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-runtime
      ports:
        - protocol: TCP
          port: 8083
{{- end }}
