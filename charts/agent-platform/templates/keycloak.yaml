{{- if .Values.foundation }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: {{ .Release.Namespace }}
data:
  adaptive-realm.json: |
    {
      "realm": "adaptive",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "clients": [{
        "clientId": "adaptive-login-config",
        "enabled": true,
        "protocol": "openid-connect",
        "clientAuthenticatorType": "client-secret",
        "secret": "${ADAPTIVE_LOGIN_CONFIG_SECRET}",
        "publicClient": false,
        "serviceAccountsEnabled": true,
        "fullScopeAllowed": true,
        "standardFlowEnabled": false,
        "directAccessGrantsEnabled": false,
        "implicitFlowEnabled": false
      }],
      "users": [{
        "username": "service-account-adaptive-login-config",
        "enabled": true,
        "serviceAccountClientId": "adaptive-login-config",
        "realmRoles": [],
        "clientRoles": {
          "realm-management": [
            "manage-clients", "view-clients", "view-realm", "manage-users", "view-users"
          ]
        }
      }]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
    - name: management
      port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: ["start-dev", "--import-realm"]
          env:
            {{- if .Values.keycloak.publicUrl }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.publicUrl | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            {{- end }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.existingSecret }}
                  key: password
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: ADAPTIVE_LOGIN_CONFIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: adaptive-keycloak-login-config
                  key: client-secret
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.keycloak.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.keycloak.storageSize | quote }}
{{- end }}
