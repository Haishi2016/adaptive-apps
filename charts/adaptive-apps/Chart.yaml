apiVersion: v2
name: adaptive-apps
description: |
  Unified capability chart for Adaptive Apps. A single chart whose
  capabilities (identity, mesh, observability, governance, ai marker)
  are toggled via feature flags. Six values overlays under ./profiles
  realize the min, core, ent, min-ai, core-ai, ent-ai portfolios.
type: application
version: 0.3.1
appVersion: "1.0.0"
keywords:
  - adaptive-apps
  - capability-portfolio
  - unified
dependencies:
  - name: agent-platform
    alias: agents
    version: 0.4.1
    repository: file://../agent-platform
    condition: features.agents.enabled
