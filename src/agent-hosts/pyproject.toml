[project]
name = "adaptive-agent-hosts"
version = "0.1.0"
description = "Hosting adapters for portable Adaptive Apps agents."
requires-python = ">=3.12"
dependencies = [
    "adaptive-agent-contracts",
    "agent-framework-core==1.19.0",
    "httpx",
    "starlette",
    "uvicorn",
]

[tool.uv.sources]
adaptive-agent-contracts = { path = "../agent-contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_agent_hosts"]
