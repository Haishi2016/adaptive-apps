[project]
name = "adaptive-agent-contracts"
version = "0.1.0"
description = "Host-neutral contracts for portable Adaptive Apps agents."
requires-python = ">=3.12"
dependencies = ["opentelemetry-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_agent_contracts"]
